spring.application.name=solicitudes
server.port=8081

# Credenciales fuera del repositorio: se leen de secretos.properties (raíz del proyecto, ignorado por Git)
spring.config.import=optional:file:./secretos.properties

# Conexión a Supabase (Session pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA: usar las tablas creadas con el script SQL, sin recrearlas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Seguridad (correcciones del escaneo ZAP) ---

# Cookie de sesión: corrige "Cookie sin el atributo SameSite"
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
# Activar solo cuando la app se sirva por HTTPS (producción)
# server.servlet.session.cookie.secure=true

# Corrige "El servidor filtra información de versión" (campo Server)
server.server-header=

# No mostrar detalles internos en las páginas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Cerrar la sesión tras 30 minutos de inactividad
server.servlet.session.timeout=30m