spring.application.name=solicitudes
server.port=8081

# Credenciales fuera del repositorio: se leen de secretos.properties (raíz del proyecto, ignorado por Git)
spring.config.import=optional:file:./secretos.properties

# Conexión a Supabase (Session pooler)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA: usar las tablas creadas con el script SQL, sin recrearlas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
