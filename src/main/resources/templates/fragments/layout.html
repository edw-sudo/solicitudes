<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos comunes: cabecera, barra de navegación, mensajes y scripts -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Solicitudes administrativas'">Solicitudes administrativas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f5f7fa; }
        .card { border: 1px solid #dde3ea; }
        .table thead th { background: #e2e8f0; font-weight: 600; }
        .badge-activo { background: #2f855a; }
        .badge-inactivo { background: #718096; }
    </style>
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark mb-4" style="background:#1f4e79">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Solicitudes administrativas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <th:block th:if="${rolActual == 'ADMINISTRADOR'}">
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/usuarios}">Usuarios y roles</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/tipos}">Tipos de solicitud</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/auditoria}">Auditoría</a></li>
                </th:block>
            </ul>
            <span class="navbar-text text-white me-3" th:if="${usuarioActual != null}">
                <span th:text="${usuarioActual}">usuario</span>
                <small class="opacity-75" th:text="'(' + ${rolActual} + ')'">(ROL)</small>
            </span>
            <form th:if="${usuarioActual != null}" th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="alertas">
    <div th:if="${ok}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${ok}">Operación correcta</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
