<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios y roles')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Usuarios y roles</h1>
        <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary">+ Nuevo usuario</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <!-- CU-04 Buscar usuarios -->
    <form th:action="@{/admin/usuarios}" method="get" class="card card-body mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-5">
                <label for="texto" class="form-label small mb-1">Username, nombre o documento</label>
                <input type="text" id="texto" name="texto" th:value="${texto}" class="form-control">
            </div>
            <div class="col-md-3">
                <label for="rol" class="form-label small mb-1">Rol</label>
                <select id="rol" name="rol" class="form-select">
                    <option value="">Todos</option>
                    <option th:each="r : ${roles}" th:value="${r.nombre}" th:text="${r.nombre}"
                            th:selected="${r.nombre == rol}">ROL</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="estado" class="form-label small mb-1">Estado</label>
                <select id="estado" name="estado" class="form-select">
                    <option value="" th:selected="${estado == ''}">Todos</option>
                    <option value="activo" th:selected="${estado == 'activo'}">Activo</option>
                    <option value="inactivo" th:selected="${estado == 'inactivo'}">Inactivo</option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-secondary">Buscar</button>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Username</th>
                    <th>Nombre completo</th>
                    <th>Documento</th>
                    <th>Rol</th>
                    <th>Área</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="7" class="text-center text-muted py-4">No se encontraron usuarios</td>
                </tr>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.username}">jperez</td>
                    <td th:text="${u.nombreCompleto}">Juan Pérez</td>
                    <td th:text="${u.numeroDocumento}">12345678</td>
                    <td th:text="${u.rol.nombre}">ESTUDIANTE</td>
                    <td th:text="${u.area != null} ? ${u.area.nombre} : '—'">—</td>
                    <td>
                        <span class="badge" th:classappend="${u.activo} ? 'badge-activo' : 'badge-inactivo'"
                              th:text="${u.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/admin/usuarios/{id}/editar(id=${u.idUsuario})}"
                           class="btn btn-sm btn-outline-primary">Editar</a>
                        <form th:if="${u.activo and u.username != usuarioActual}"
                              th:action="@{/admin/usuarios/{id}/baja(id=${u.idUsuario})}" method="post" class="d-inline"
                              th:data-nombre="${u.username}"
                              onsubmit="return confirm('¿Dar de baja al usuario ' + this.dataset.nombre + '? La cuenta quedará inactiva.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Dar de baja</button>
                        </form>
                        <form th:if="${!u.activo}"
                              th:action="@{/admin/usuarios/{id}/reactivar(id=${u.idUsuario})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">Reactivar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small mt-2" th:text="${#lists.size(usuarios)} + ' usuario(s)'">0 usuario(s)</p>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
