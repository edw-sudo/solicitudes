<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tipos de solicitud')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Tipos de solicitud</h1>
        <a th:href="@{/admin/tipos/nuevo}" class="btn btn-primary">+ Nuevo tipo</a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Descripción</th>
                    <th>Área responsable</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(tipos)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay tipos de solicitud registrados</td>
                </tr>
                <tr th:each="t : ${tipos}">
                    <td th:text="${t.nombre}">Constancia de estudios</td>
                    <td class="text-muted small" th:text="${t.descripcion} ?: '—'">Descripción</td>
                    <td th:text="${t.area.nombre}">Secretaría Académica</td>
                    <td>
                        <span class="badge" th:classappend="${t.activo} ? 'badge-activo' : 'badge-inactivo'"
                              th:text="${t.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/admin/tipos/{id}/editar(id=${t.idTipoSolicitud})}"
                           class="btn btn-sm btn-outline-primary">Editar</a>
                        <form th:if="${t.activo}" th:action="@{/admin/tipos/{id}/baja(id=${t.idTipoSolicitud})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('¿Dar de baja este tipo de solicitud? Ya no se ofrecerá para nuevas solicitudes.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Dar de baja</button>
                        </form>
                        <form th:if="${!t.activo}" th:action="@{/admin/tipos/{id}/reactivar(id=${t.idTipoSolicitud})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">Reactivar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
