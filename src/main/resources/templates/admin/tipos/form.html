<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.esNuevo() ? 'Nuevo tipo de solicitud' : 'Editar tipo de solicitud'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container" style="max-width: 720px">
    <h1 class="h3 mb-3" th:text="${form.esNuevo()} ? 'Nuevo tipo de solicitud' : 'Editar tipo de solicitud'">Nuevo tipo</h1>

    <form th:object="${form}" method="post" class="card card-body" novalidate
          th:action="${form.esNuevo()} ? @{/admin/tipos/nuevo} : @{/admin/tipos/{id}/editar(id=${form.idTipoSolicitud})}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
            <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</p>
        </div>

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del trámite</label>
            <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid" maxlength="120">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción y requisitos</label>
            <textarea th:field="*{descripcion}" class="form-control" th:errorclass="is-invalid" rows="3" maxlength="300"></textarea>
            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
        </div>
        <div class="mb-3">
            <label for="idArea" class="form-label">Área responsable</label>
            <select th:field="*{idArea}" class="form-select" th:errorclass="is-invalid">
                <option value="">Seleccione un área</option>
                <option th:each="a : ${areas}" th:value="${a.idArea}" th:text="${a.nombre}">Área</option>
            </select>
            <div class="invalid-feedback" th:errors="*{idArea}"></div>
        </div>

        <div class="mt-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/admin/tipos}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
