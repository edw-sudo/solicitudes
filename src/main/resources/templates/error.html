<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error | Solicitudes administrativas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body style="background:#f5f7fa">
<main class="container" style="margin-top:10vh">
    <div class="card">
        <div class="card-body">
            <h1 class="h4">Ocurrió un problema</h1>
            <p class="mb-3">
                <span th:text="${status} ?: ''">404</span>
                <span th:text="${error} ?: ''">Not Found</span>
            </p>
            <a href="/" class="btn btn-outline-primary">Volver al inicio</a>
        </div>
    </div>
</main>
</body>
</html>
